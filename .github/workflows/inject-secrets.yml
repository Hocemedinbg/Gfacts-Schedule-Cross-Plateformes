name: Inject secrets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate runtime config
        run: |
          mkdir -p config
          GH_B64=$(printf '%s' "${{ secrets.GH_TOKEN }}" | base64 -w0)
          OR_B64=$(printf '%s' "${{ secrets.OPENROUTER_API_KEY }}" | base64 -w0)
          printf '{\n  "gh_token_b64": "%s",\n  "or_api_key_b64": "%s"\n}\n' "$GH_B64" "$OR_B64" > config/runtime-config.json
      - name: Commit config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/runtime-config.json
          git commit -m "chore: update runtime config from secrets" || echo "No changes"
          git push
