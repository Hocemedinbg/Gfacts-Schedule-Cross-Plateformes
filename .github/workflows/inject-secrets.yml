name: Inject secrets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier les secrets
        env:
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN }}
          OR_KEY_SECRET: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$GH_TOKEN_SECRET" ]; then
            echo "::error::Secret GH_TOKEN manquant ou vide. Allez dans Settings → Secrets and variables → Actions → New repository secret (nom exact : GH_TOKEN)."
            exit 1
          fi
          if [ -z "$OR_KEY_SECRET" ]; then
            echo "::error::Secret OPENROUTER_API_KEY manquant ou vide. Creez-le avec le nom exact : OPENROUTER_API_KEY"
            exit 1
          fi
          echo "OK : les 2 secrets sont presents."

      - name: Ecrire config/runtime-config.json via l API GitHub
        env:
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN }}
          OR_KEY_SECRET: ${{ secrets.OPENROUTER_API_KEY }}
          REPO: ${{ github.repository }}
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          # Encodage Base64 des 2 secrets
          GH_B64=$(printf '%s' "$GH_TOKEN_SECRET" | base64 -w0)
          OR_B64=$(printf '%s' "$OR_KEY_SECRET" | base64 -w0)

          # Construction du JSON de config, puis encodage Base64 du fichier entier
          CONTENT_JSON=$(jq -n --arg gh "$GH_B64" --arg or "$OR_B64" '{gh_token_b64:$gh, or_api_key_b64:$or}')
          FILE_B64=$(printf '%s' "$CONTENT_JSON" | base64 -w0)

          # SHA du fichier existant (vide s'il n'existe pas encore)
          SHA=$(curl -sS -H "Authorization: Bearer $API_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/config/runtime-config.json?ref=$BRANCH" \
            | jq -r '.sha // empty')

          echo "SHA existant : ${SHA:-aucun (nouveau fichier)}"

          # Payload d'ecriture (API Contents)
          if [ -n "$SHA" ]; then
            PAYLOAD=$(jq -n --arg msg "chore: update runtime config from secrets" --arg c "$FILE_B64" --arg b "$BRANCH" --arg s "$SHA" \
              '{message:$msg, content:$c, branch:$b, sha:$s}')
          else
            PAYLOAD=$(jq -n --arg msg "chore: create runtime config from secrets" --arg c "$FILE_B64" --arg b "$BRANCH" \
              '{message:$msg, content:$c, branch:$b}')
          fi

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/config/runtime-config.json" \
            -d "$PAYLOAD")

          echo "Reponse HTTP : $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Echec de l ecriture du fichier (HTTP $HTTP_CODE). Details :"
            cat response.json
            exit 1
          fi

          echo "✅ config/runtime-config.json ecrit avec succes dans la branche $BRANCH"
